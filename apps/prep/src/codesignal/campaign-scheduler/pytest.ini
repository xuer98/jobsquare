[pytest]
markers =
    level1: Level 1 - campaign lifecycle CRUD (100 pts, ~10 min)
    level2: Level 2 - querying, ranking and aggregation (150 pts, ~20 min)
    level3: Level 3 - budgets and sliding-window rate limiting (150 pts, ~30 min)
    level4: Level 4 - snapshot, restore and audit trail (200 pts, ~30 min)
addopts = --strict-markers
testpaths = .
