[pytest]
addopts = --strict-markers
markers =
    level1: Level 1 -- core account operations (100 pts, ~10 min)
    level2: Level 2 -- top spenders aggregation (150 pts, ~20 min)
    level3: Level 3 -- scheduled and cancellable payments (150 pts, ~30 min)
    level4: Level 4 -- account merges and historical balances (200 pts, ~30 min)
testpaths = .
