[pytest]
addopts = --strict-markers
markers =
    level1: Level 1 -- mkdir, add_file, get_file_size (100 pts, ~10 min)
    level2: Level 2 -- get_dir_size, find_largest_file (150 pts, ~20 min)
    level3: Level 3 -- move and copy across the tree (150 pts, ~30 min)
    level4: Level 4 -- find_files_by_size, the backward-compatible export (200 pts, ~30 min)
testpaths = .
