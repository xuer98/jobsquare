[pytest]
addopts = --strict-markers
markers =
    level1: Level 1 -- core set/get/delete operations (100 pts, ~10 min)
    level2: Level 2 -- scan and scan_by_prefix aggregation (150 pts, ~20 min)
    level3: Level 3 -- TTL support and the expiry refactor (150 pts, ~25 min)
    level4: Level 4 -- backup and restore (200 pts, ~35 min)
testpaths = .
